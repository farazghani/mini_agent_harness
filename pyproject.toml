[project]
name = "mini-agent-harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "farazghani01@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
mini-agent-harness = "mini_agent_harness:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

# add to pyproject.toml
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]